[package]
name = "leaf-ffi"
version = "0.1.0"
authors = ["eycorsican <eric.y.corsican@gmail.com>"]
edition = "2021"

[lib]
name = "leaf"
path = "src/lib.rs"
crate-type = ["staticlib", "dylib"]

[features]
default = [
    "default-aws-lc",
    "auto-reload",
]

default-aws-lc= [
    "leaf/default-aws-lc",
]

default-ring = [
    "leaf/default-ring",
]

default-openssl = [
    "leaf/default-openssl",
]

# BoringSSL for TLS and AEAD: with `kiri`, one BoringSSL shared with kiri.
default-boring = [
    "leaf/default-boring",
]

auto-reload = ["leaf/auto-reload"]

# The kiri outbound and bridge service (leaf feature `kiri`; not with
# default-openssl: kiri links BoringSSL; default-boring shares it).
kiri = ["leaf/kiri"]

[dependencies]
leaf = { path = "../leaf", default-features = false, optional = true }
tokio = { version = "1", features = ["rt"] }
anyhow = "1.0"
futures = "0.3"
