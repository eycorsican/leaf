[package]
name = "leaf-cli"
version = "0.14.2"
authors = ["eycorsican <eric.y.corsican@gmail.com>"]
edition = "2021"

[[bin]]
name = "leaf"
path = "src/main.rs"

[features]
# TLS/crypto backend: one of these (for another than the default, build with
# `--no-default-features --features default-boring`, say).
default = ["default-aws-lc"]
default-aws-lc = ["leaf/default-aws-lc"]
default-ring = ["leaf/default-ring"]
default-openssl = ["leaf/default-openssl"]
default-boring = ["leaf/default-boring"]

# The kiri outbound and bridge service (leaf feature `kiri`).
kiri = ["leaf/kiri"]

[dependencies]
tokio = { version = "1", features = ["rt"] }
argh = "0.1"

[target.'cfg(not(windows))'.dependencies.leaf]
path = "../leaf"
default-features = false
features = [
  "ctrlc",
  "auto-reload"
]

[target.'cfg(windows)'.dependencies.leaf]
path = "../leaf"
default-features = false
features = [
  "ctrlc",
  "auto-reload",
  "inbound-nf",
  "rule-process-name"
]
