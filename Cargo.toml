[workspace]
members = [
    "leaf",
    "leaf-plugin-abi",
    "leaf-cli",
    "leaf-ffi",
    "leaf-plugins/shadowsocks-cabi-rs",
    "leaf-plugins/tls-cabi-rs",
    "leaf-e2e",
    "leaf-e2e/plugins/conformance-cabi",
]
default-members = ["leaf-cli"]
# The end-to-end suite builds servers from other projects from source, in their
# own checkouts under here; one of them is a Rust crate, and without this cargo
# would take it for a member of this workspace and refuse to build it.
exclude = ["target/e2e-upstream"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
# codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
